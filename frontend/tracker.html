<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YARA — Period Tracker</title>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <img src="assets/yara-logo.png" alt="YARA Logo" class="logo" />
      <h1>YARA</h1>
      <p class="tagline">Period & Cycle Tracker</p>

      <nav class="nav-tabs">
        <a href="index.html" class="nav-tab">Dashboard</a>
        <a href="pcos.html" class="nav-tab">PCOS Prediction</a>
        <a href="tracker.html" class="nav-tab active">Period Tracker</a>
        <a href="blogs.html" class="nav-tab">Blogs</a>
      </nav>
    </header>

    <!-- form for start date + cycle length -->
    <form id="tracker-form">
      <div class="form-row">
        <label for="last_period">Period start date:</label>
        <input type="date" id="last_period" name="last_period" required />
      </div>
      <div class="form-row">
        <label for="cycle_days">Cycle length (days):</label>
        <input type="number" id="cycle_days" name="cycle_days" min="15" max="60" required />
      </div>
      <button type="submit">Save Period</button>
    </form>

    <h3 id="tracker-result"></h3>

    <!-- Month slider -->
    <div style="display:flex; justify-content:center; align-items:center; gap:0.8rem; margin-top:1.8rem;">
      <button id="prev-month" type="button" class="nav-tab" style="padding:0.2rem 0.6rem;">◀</button>
      <h3 id="month-title" style="margin:0; color:var(--accent-dark);"></h3>
      <button id="next-month" type="button" class="nav-tab" style="padding:0.2rem 0.6rem;">▶</button>
    </div>

    <div id="calendar" style="margin-top:0.8rem;"></div>

    <h3 style="margin-top:1.8rem; text-align:center; color:var(--accent-dark);">
      Summary Report
    </h3>
    <div id="tracker-report" style="margin-top:0.5rem; font-size:0.95rem; color:#4b304a;"></div>

    <!-- Analyse button + analysis panel -->
    <div style="margin-top:1.2rem; text-align:center;">
      <button id="analyse-btn" type="button" class="nav-tab" style="padding:0.4rem 1.2rem;">
        Analyse My Periods
      </button>
    </div>

    <div id="analysis-panel"
         style="margin-top:1rem; padding:1rem 1.2rem; border-radius:14px; background:#fff7fb; box-shadow:0 3px 10px rgba(183,110,121,0.2); display:none;">
      <h3 style="margin-top:0; color:var(--accent-dark); text-align:center;">Your Period Analysis</h3>
      <div id="analysis-content" style="font-size:0.95rem; color:#4b304a;"></div>
    </div>
  </div>

  <!-- Sakhi floating assistant -->
  <button id="sakhi-toggle" class="sakhi-button" type="button" title="Chat with Sakhi">
    <img src="assets/yara-logo.png" alt="Sakhi" />
  </button>

  <div id="sakhi-panel" class="sakhi-panel hidden">
    <div class="sakhi-panel-header">
      <span>🩷 Sakhi</span>
      <button class="sakhi-close" id="sakhi-close" type="button">&times;</button>
    </div>
    <div id="sakhi-messages" class="sakhi-messages"></div>
    <div class="sakhi-input-row">
      <input id="sakhi-input" type="text" placeholder="Ask about your cycle, mood..." />
      <button id="sakhi-send" type="button">Send</button>
    </div>
  </div>

  <!-- Firebase config + helpers -->
  <script src="firebase.js"></script>

  <!-- Tracker + Sakhi logic -->
  <script src="sakhi.js">
    const CYCLE_STORAGE_KEY = "yara_period_history";  // start+cycle
    const DAY_STORAGE_KEY = "yara_period_days";       // per-day logs

    let viewYear;
    let viewMonth; // 0-11
    let currentUserId = null; // Firebase anonymous user id

    // ---------- storage helpers ----------

    function loadCycles() {
      try {
        const raw = localStorage.getItem(CYCLE_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveCycles(history) {
      localStorage.setItem(CYCLE_STORAGE_KEY, JSON.stringify(history));
    }

    function loadDayLogs() {
      try {
        const raw = localStorage.getItem(DAY_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveDayLogs(logs) {
      localStorage.setItem(DAY_STORAGE_KEY, JSON.stringify(logs));
    }

    // ---------- form submit (start + cycle) ----------

    document.getElementById("tracker-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const dateStr = document.getElementById("last_period").value;
      const cycleDays = parseInt(document.getElementById("cycle_days").value, 10);
      if (!dateStr || !cycleDays) return;

      const history = loadCycles();
      history.push({ start: dateStr, cycle: cycleDays });
      saveCycles(history);

      updateSummaryAndCalendar();
      e.target.reset();
    });

    // ---------- calculations ----------

    function getAverageCycle(history) {
      if (!history.length) return null;
      const sum = history.reduce((acc, item) => acc + (item.cycle || 0), 0);
      return Math.round(sum / history.length);
    }

    function updateSummaryAndCalendar() {
      const history = loadCycles();
      const resultEl = document.getElementById("tracker-result");
      const reportEl = document.getElementById("tracker-report");

      if (!history.length) {
        resultEl.innerText = "Add your first period to start tracking.";
        reportEl.innerText = "";
        renderMonthCalendar([], [], viewYear, viewMonth);
        return;
      }

      history.sort((a, b) => new Date(a.start) - new Date(b.start));
      const first = history[0];
      const last = history[history.length - 1];
      const avgCycle = getAverageCycle(history);

      const lastDate = new Date(last.start);
      const next = new Date(lastDate);
      next.setDate(lastDate.getDate() + (avgCycle || last.cycle));

      resultEl.innerText =
        "Last period: " + lastDate.toDateString() +
        " | Avg cycle: " + (avgCycle || last.cycle) + " days" +
        " | Estimated next: " + next.toDateString();

      const shortest = Math.min(...history.map(h => h.cycle));
      const longest = Math.max(...history.map(h => h.cycle));

      reportEl.innerHTML =
        "Total cycles tracked: <b>" + history.length + "</b><br>" +
        "Tracking since: <b>" + new Date(first.start).toDateString() + "</b><br>" +
        "Shortest cycle: <b>" + shortest + " days</b><br>" +
        "Longest cycle: <b>" + longest + " days</b>";

      const dayLogs = loadDayLogs();
      renderMonthCalendar(history, dayLogs, viewYear, viewMonth, next);
    }

    // ---------- Analyse button ----------

    document.getElementById("analyse-btn").addEventListener("click", () => {
      const cycles = loadCycles();
      const dayLogs = loadDayLogs();
      const panel = document.getElementById("analysis-panel");
      const content = document.getElementById("analysis-content");

      if (!cycles.length && !dayLogs.length) {
        panel.style.display = "block";
        content.innerHTML = "Add some periods and daily logs first so Sakhi can understand your pattern.";
        return;
      }

      let avgCycle = getAverageCycle(cycles);
      let cycleComment = "";
      if (avgCycle) {
        if (avgCycle >= 26 && avgCycle <= 32) {
          cycleComment = "Your average cycle length looks within the typical range (around 28 days).";
        } else if (avgCycle < 26) {
          cycleComment = "Your average cycle seems on the shorter side. Short cycles can still be normal, but if they worry you, consider discussing with a doctor.";
        } else {
          cycleComment = "Your average cycle seems on the longer side. Longer cycles can be normal for some, but if they are very irregular or you miss periods, talk to a doctor.";
        }
      }

      const cyclesList = cycles.map(c => c.cycle).sort((a,b)=>a-b);
      let variabilityComment = "";
      if (cyclesList.length >= 2) {
        const minC = cyclesList[0];
        const maxC = cyclesList[cyclesList.length - 1];
        const spread = maxC - minC;
        if (spread <= 3) {
          variabilityComment = "Your cycle lengths look fairly consistent from month to month.";
        } else if (spread <= 7) {
          variabilityComment = "There is some variation in your cycle length, which is common.";
        } else {
          variabilityComment = "Your cycle lengths vary quite a bit. If this is new for you or combined with very heavy/painful periods, consider medical advice.";
        }
      }

      const periodLogs = dayLogs.filter(l => l.isPeriod);
      const periodDaysCount = periodLogs.length;

      const flowMap = { low: 0, medium: 0, high: 0 };
      const crampsMap = { low: 0, medium: 0, high: 0 };

      periodLogs.forEach(l => {
        if (flowMap[l.flow] != null) flowMap[l.flow]++;
        if (crampsMap[l.cramps] != null) crampsMap[l.cramps]++;
      });

      const dominantFlow = Object.entries(flowMap).sort((a,b)=>b[1]-a[1])[0];
      const dominantCramps = Object.entries(crampsMap).sort((a,b)=>b[1]-a[1])[0];

      let flowComment = "";
      if (dominantFlow && dominantFlow[1] > 0) {
        if (dominantFlow[0] === "low" || dominantFlow[0] === "medium") {
          flowComment = "Your logged flow is mostly " + dominantFlow[0] + ". That can be comfortable for many people.";
        } else {
          flowComment = "You often log heavy flow. If you need to change pads very frequently or feel dizzy/very tired, discuss heavy bleeding with a doctor.";
        }
      }

      let crampsComment = "";
      if (dominantCramps && dominantCramps[1] > 0) {
        if (dominantCramps[0] === "low" || dominantCramps[0] === "medium") {
          crampsComment = "Your cramps are mostly " + dominantCramps[0] + ". Mild to moderate cramps are common.";
        } else {
          crampsComment = "You often log strong cramps. If pain stops you from daily activities, consider medical support and pain management.";
        }
      }

      const moodsSample = dayLogs
        .map(l => (l.mood || "").trim())
        .filter(m => m.length > 0)
        .slice(-5);
      let moodComment = "";
      if (moodsSample.length) {
        moodComment = "Recently you noted: " + moodsSample.join(", ") +
          ". It can help to notice what makes you feel better and keep those habits on heavy days.";
      }

      panel.style.display = "block";
      content.innerHTML =
        `<p><b>Cycles tracked:</b> ${cycles.length || 0}</p>` +
        (avgCycle ? `<p><b>Average cycle length:</b> ${avgCycle} days.</p>` : "") +
        (cycleComment ? `<p>${cycleComment}</p>` : "") +
        (variabilityComment ? `<p>${variabilityComment}</p>` : "") +
        `<p><b>Total logged period days:</b> ${periodDaysCount}</p>` +
        (flowComment ? `<p>${flowComment}</p>` : "") +
        (crampsComment ? `<p>${crampsComment}</p>` : "") +
        (moodComment ? `<p>${moodComment}</p>` : "") +
        `<p style="margin-top:0.6rem; font-size:0.85rem; color:#7a4a66;">
          This analysis is informational, not a diagnosis. If you notice sudden changes, very heavy bleeding, or severe pain, please talk to a healthcare professional.
        </p>`;
    });

    // ---------- month slider ----------

    document.getElementById("prev-month").addEventListener("click", () => {
      viewMonth--;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      }
      updateSummaryAndCalendar();
    });

    document.getElementById("next-month").addEventListener("click", () => {
      viewMonth++;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      updateSummaryAndCalendar();
    });

    // ---------- render one month, clickable days ----------

    function renderMonthCalendar(history, dayLogs, year, month, nextDate) {
      const today = new Date();
      if (year == null || month == null) {
        year = today.getFullYear();
        month = today.getMonth();
        viewYear = year;
        viewMonth = month;
      }

      const calDiv = document.getElementById("calendar");
      const titleEl = document.getElementById("month-title");
      calDiv.innerHTML = "";

      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      titleEl.textContent = firstDay.toLocaleString("default", {
        month: "long",
        year: "numeric",
      });

      const grid = document.createElement("div");
      grid.style.display = "grid";
      grid.style.gridTemplateColumns = "repeat(7, 1fr)";
      grid.style.gap = "4px";
      calDiv.appendChild(grid);

      const weekdayNames = ["S", "M", "T", "W", "T", "F", "S"];
      weekdayNames.forEach((w) => {
        const cell = document.createElement("div");
        cell.textContent = w;
        cell.style.textAlign = "center";
        cell.style.fontWeight = "600";
        cell.style.color = "#82416d";
        grid.appendChild(cell);
      });

      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement("div");
        grid.appendChild(empty);
      }

      const periodDays = new Set();
      history.forEach((item) => {
        const start = new Date(item.start);
        const length = 4;
        for (let i = 0; i < length; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          if (d.getMonth() === month && d.getFullYear() === year) {
            periodDays.add(d.getDate());
          }
        }
      });

      const nextDay =
        nextDate &&
        nextDate.getMonth() === month &&
        nextDate.getFullYear() === year
          ? nextDate.getDate()
          : null;

      const logMap = {};
      dayLogs.forEach((log) => {
        logMap[log.date] = log;
      });

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.textContent = day;
        cell.style.textAlign = "center";
        cell.style.padding = "0.4rem 0";
        cell.style.borderRadius = "8px";
        cell.style.fontSize = "0.85rem";
        cell.style.cursor = "pointer";

        const dateObj = new Date(year, month, day);
        const dateKey = dateObj.toISOString().slice(0, 10);
        const existingLog = logMap[dateKey];

        if (periodDays.has(day)) {
          cell.style.background = "#f8b8cc";
          cell.style.color = "#5b2942";
        } else if (nextDay === day) {
          cell.style.background = "var(--accent)";
          cell.style.color = "#fff";
          cell.style.fontWeight = "600";
        } else {
          cell.style.background = "#fdf0f6";
          cell.style.color = "#4b304a";
        }

        if (existingLog && existingLog.isPeriod) {
          cell.style.border = "2px solid #ad2f64";
        }

        cell.addEventListener("click", () => {
          const latestLogs = loadDayLogs();
          const latest = latestLogs.find(l => l.date === dateKey) || null;
          handleDayClick(dateKey, latest);
        });

        grid.appendChild(cell);
      }
    }

    // ---------- modal for per-day log ----------

    let modalDateKey = null;
    const modalEl = document.getElementById("day-modal");
    const modalTitle = document.getElementById("day-modal-title");
    const modalFlow = document.getElementById("modal-flow");
    const modalCramps = document.getElementById("modal-cramps");
    const modalMood = document.getElementById("modal-mood");
    const modalCancel = document.getElementById("modal-cancel");
    const modalSave = document.getElementById("modal-save");

    function openModal(dateKey, existingLog) {
      modalDateKey = dateKey;
      modalTitle.textContent = "Log for " + dateKey;

      const periodYes = document.querySelector("input[name='modal-period'][value='yes']");
      const periodNo = document.querySelector("input[name='modal-period'][value='no']");

      if (existingLog && existingLog.isPeriod) {
        periodYes.checked = true;
      } else {
        periodNo.checked = true;
      }

      modalFlow.value = (existingLog && existingLog.flow) || "medium";
      modalCramps.value = (existingLog && existingLog.cramps) || "medium";
      modalMood.value = (existingLog && existingLog.mood) || "";

      modalEl.classList.remove("hidden");
    }

    function closeModal() {
      modalEl.classList.add("hidden");
      modalDateKey = null;
    }

    modalCancel.addEventListener("click", closeModal);

    modalSave.addEventListener("click", () => {
      if (!modalDateKey) return;

      const periodValue =
        document.querySelector("input[name='modal-period']:checked")?.value || "no";
      const isPeriod = periodValue === "yes";

      const newLog = {
        date: modalDateKey,
        isPeriod,
        flow: modalFlow.value || "medium",
        cramps: modalCramps.value || "medium",
        mood: modalMood.value || "",
      };

      const logs = loadDayLogs();
      const idx = logs.findIndex((l) => l.date === modalDateKey);
      if (idx >= 0) logs[idx] = newLog;
      else logs.push(newLog);
      saveDayLogs(logs);

      if (currentUserId) {
        saveLogsToFirestore(currentUserId, logs).catch((err) =>
          console.error("Failed to save logs to Firestore:", err)
        );
      }

      closeModal();
      updateSummaryAndCalendar();
    });

    function handleDayClick(dateKey, existingLog) {
      openModal(dateKey, existingLog);
    }

    // ---------- Sakhi assistant (rule-based) ----------

    const sakhiToggle = document.getElementById("sakhi-toggle");
    const sakhiPanel = document.getElementById("sakhi-panel");
    const sakhiClose = document.getElementById("sakhi-close");
    const sakhiMessages = document.getElementById("sakhi-messages");
    const sakhiInput = document.getElementById("sakhi-input");
    const sakhiSend = document.getElementById("sakhi-send");

    function sakhiAddMsg(text, who) {
      const div = document.createElement("div");
      div.className = "sakhi-msg " + who;
      div.textContent = text;
      sakhiMessages.appendChild(div);
      sakhiMessages.scrollTop = sakhiMessages.scrollHeight;
    }

    function sakhiPersonalSummary() {
      const cycles = loadCycles();
      const dayLogs = loadDayLogs();
      if (!cycles.length && !dayLogs.length) {
        return "Start logging your cycles and daily symptoms, and I will summarise patterns for you.";
      }
      let msg = "";
      if (cycles.length) {
        const avg = getAverageCycle(cycles);
        msg += `You have logged ${cycles.length} cycles; your average cycle length is about ${avg} days. `;
      }
      const periodLogs = dayLogs.filter(l => l.isPeriod);
      if (periodLogs.length) {
        msg += `You marked ${periodLogs.length} period days so far. `;
      }
      return msg || "I can see your data is growing. Keep logging for richer insights.";
    }

    function sakhiReply(userText) {
      const text = userText.toLowerCase();
      if (text.includes("pcos")) {
        return "PCOS is a hormonal condition that can affect cycles, skin, hair and weight. YARA uses your answers on the PCOS page to estimate risk, but only a doctor can diagnose it.";
      }
      if (text.includes("late") || text.includes("delay")) {
        return "A late period can be due to stress, illness, weight changes, PCOS, thyroid issues or pregnancy. If your period is more than 2 weeks late or often irregular, talk to a doctor.";
      }
      if (text.includes("pain") || text.includes("cramp")) {
        return "Mild cramps are common, but if pain stops you from working, studying or sleeping, that is a sign to seek medical advice. Heat pads, gentle stretching and hydration may help meanwhile.";
      }
      if (text.includes("cycle") || text.includes("length")) {
        return sakhiPersonalSummary();
      }
      if (text.includes("mood") || text.includes("anxious") || text.includes("sad")) {
        return "Mood changes around periods are very common. Try tracking your mood here, and notice which days feel heavier emotionally. If sadness or anxiety is constant or very strong, ask for professional mental health support.";
      }
      return "I am Sakhi, your cycle buddy. You can ask me about PCOS, late periods, pain, cycle length, or mood. I use your logged data to give more personal hints, but I do not replace a doctor.";
    }

    sakhiToggle.addEventListener("click", () => {
      const isHidden = sakhiPanel.classList.contains("hidden");
      if (isHidden) {
        sakhiPanel.classList.remove("hidden");
        if (!sakhiMessages.childElementCount) {
          sakhiAddMsg("Hi, I am Sakhi. Ask me about your cycle, pain, or mood. I will use your YARA logs to guide you.", "bot");
        }
      } else {
        sakhiPanel.classList.add("hidden");
      }
    });

    sakhiClose.addEventListener("click", () => {
      sakhiPanel.classList.add("hidden");
    });

    function sakhiHandleSend() {
      const text = sakhiInput.value.trim();
      if (!text) return;
      sakhiAddMsg(text, "me");
      sakhiInput.value = "";
      const reply = sakhiReply(text);
      setTimeout(() => sakhiAddMsg(reply, "bot"), 200);
    }

    sakhiSend.addEventListener("click", sakhiHandleSend);
    sakhiInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sakhiHandleSend();
      }
    });

    // ---------- init: sign in anon and sync from Firestore ----------

    (function init() {
      const today = new Date();
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();

      signInAnon()
        .then((user) => {
          currentUserId = user.uid;
          return loadLogsFromFirestore(currentUserId);
        })
        .then((cloudLogs) => {
          if (cloudLogs && cloudLogs.length) {
            saveDayLogs(cloudLogs);
          }
          updateSummaryAndCalendar();
        })
        .catch((err) => {
          console.error("Firebase init failed, using local only:", err);
          updateSummaryAndCalendar();
        });
    })();
  </script>

</body>
</html>
